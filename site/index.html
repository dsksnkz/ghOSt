<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Rail, calendar, sidebar, settings and launcher for Hyprland.">
    <title>ghOSt</title>
    <link rel="stylesheet" href="style.css?v=20261004-mfd">
  </head>
  <body>
    <header>
      <a class="brand" href="./" aria-label="ghOSt home">
        <img src="assets/icons/white/ghost.svg" width="28" height="28" alt="">ghOSt
      </a>
      <a href="https://github.com/dsksnkz/ghOSt">Source ↗</a>
    </header>
    <main>
      <nav id="surfaces" aria-label="Components">
        <button type="button" data-view="rail" aria-pressed="false">Top rail</button>
        <button type="button" data-view="calendar" aria-pressed="true">Calendar</button>
        <button type="button" data-view="sidebar" aria-pressed="false">Sidebar</button>
        <button type="button" data-view="settings" aria-pressed="false">Settings</button>
        <button type="button" data-view="launcher" aria-pressed="false">App launcher</button>
        <button type="button" data-view="sidebar-motion" aria-pressed="false">Sidebar motion</button>
        <button type="button" data-view="calendar-motion" aria-pressed="false">Calendar motion</button>
      </nav>
      <section class="display" aria-label="Component display">
        <div class="display-header">
          <h1 id="display-title">Calendar</h1>
          <span id="capture-kind">Desktop capture</span>
        </div>
        <div id="stage" aria-busy="false"></div>
        <p id="load-error" role="alert" hidden>Image unavailable. Choose another view or reload.</p>
        <div id="settings-controls" class="mfd-controls" hidden>
          <button id="previous-page" type="button" aria-label="Previous Settings page">←</button>
          <label class="page-picker">
            <span class="sr-only">Settings page</span>
            <select id="settings-page"></select>
          </label>
          <output id="page-number" aria-label="Page number">01 / 14</output>
          <button id="next-page" type="button" aria-label="Next Settings page">→</button>
        </div>
        <div class="display-footer">
          <p id="description" aria-live="polite">Weather, dates and device usage. System readings drive the meters.</p>
          <button id="replay" type="button" hidden>Replay</button>
          <a id="full-image" href="assets/calendar-native.png" target="_blank" rel="noopener">Full image ↗</a>
        </div>
      </section>
    </main>
    <footer>Arch Linux · Hyprland · Quickshell<span>Captures, not remote controls.</span></footer>
    <script type="module" src="app.js?v=20261004-mfd"></script>
  </body>
</html>
